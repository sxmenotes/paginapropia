<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <style>
    .brand-title { font-family: 'Shippori Mincho', 'Outfit', serif; font-weight: 700; font-size: 23px; fill: #1F1E1C; letter-spacing: 1px; }
    .brand-accent { fill: #9E2A2B; }
    .brand-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 8.5px; fill: #736B60; letter-spacing: 3.5px; font-weight: 600; }
  </style>
  <g transform="translate(10, 10)">
    <!-- Wabi-Sabi Organic Circle Stamp Icon -->
    <circle cx="20" cy="20" r="18" fill="#F4EFE6" stroke="#9E2A2B" stroke-width="1.5" stroke-dasharray="3 1"/>
    <circle cx="20" cy="20" r="8" fill="#9E2A2B" opacity="0.9"/>
    <!-- Chopsticks accent -->
    <path d="M7 33 L33 7" stroke="#1F1E1C" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="65" y="32" class="brand-title">SUSHI <tspan class="brand-accent">KAIZEN</tspan></text>
  <text x="65" y="46" class="brand-sub">TEA HOUSE & OMAKASE</text>
</svg>
