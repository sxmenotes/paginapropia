<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="svGradient" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orbitGradient" x1="0" y1="50" x2="100" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Orbital Ring Back -->
  <ellipse cx="50" cy="50" rx="42" ry="18" transform="rotate(-30 50 50)" stroke="url(#orbitGradient)" stroke-width="2.5" stroke-dasharray="140 30" stroke-linecap="round" opacity="0.6"/>

  <!-- Monogram S -->
  <path d="M 52 28 C 44 28 36 32 36 40 C 36 50 58 48 58 58 C 58 65 48 68 40 64" 
        stroke="url(#svGradient)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Monogram V -->
  <path d="M 44 42 L 56 74 L 72 34" 
        stroke="url(#svGradient)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Orbital Ring Front / Satellite -->
  <ellipse cx="50" cy="50" rx="42" ry="18" transform="rotate(-30 50 50)" stroke="url(#orbitGradient)" stroke-width="2.5" stroke-dasharray="80 120" stroke-dashoffset="-40" stroke-linecap="round"/>
  
  <!-- Satellite Nodes -->
  <circle cx="80" cy="32" r="3.5" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="80" cy="32" r="1.5" fill="#ffffff"/>
</svg>
