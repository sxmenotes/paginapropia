<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Samuel Valenzuela</title>
  <meta name="description" content="La página que buscas no existe o ha sido movida.">
  <meta name="theme-color" content="#08090d">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="./logos/isologo_white.png">
  <link rel="stylesheet" href="./style.css">
  
  <style>
    .not-found-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 5%;
      position: relative;
      z-index: 2;
    }
    
    .not-found-kicker {
      font-family: 'JetBrains Mono', monospace;
      color: #66fcf1;
      font-size: 1rem;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .not-found-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(5rem, 20vw, 15rem);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, #4a505e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.05em;
    }

    .not-found-desc {
      font-size: clamp(1.1rem, 2vw, 1.3rem);
      color: #949ca9;
      max-width: 500px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2rem;
      background: #fff;
      color: #08090d;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      text-decoration: none;
      border-radius: 4px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn-return:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255,255,255,0.1);
    }
  </style>
</head>

<body>

  <!-- Ambient Grid & Technical Texture -->
  <div class="ambient-grid" aria-hidden="true"></div>
  <div class="ambient-light" aria-hidden="true"></div>

  <!-- ===================== NAVIGATION ===================== -->
  <header id="site-header">
    <nav id="navbar" aria-label="Navegación principal">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo" aria-label="Samuel Valenzuela — Inicio">
          <img src="./logos/logo_completo_white.png" alt="Samuel Valenzuela Logo" width="160" height="36" class="nav-logo-img">
        </a>
      </div>
    </nav>
  </header>

  <main>
    <section class="not-found-section reveal-elem">
      <span class="not-found-kicker">Error 404</span>
      <h1 class="not-found-title">404</h1>
      <p class="not-found-desc">La página que buscas ha sido movida a otro universo o simplemente no existe.</p>
      
      <a href="index.html" class="btn-return">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver al inicio
      </a>
    </section>
  </main>

  <script src="./main.js"></script>
</body>
</html>
